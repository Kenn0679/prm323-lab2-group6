<!-- Mobile Frame: Android 360 x 800 dp -->
<main class="w-[360px] h-[800px] bg-[#FFFFFF] relative flex flex-col overflow-hidden box-border">

<h1 class="font-headline text-headline text-[#1C1B18] tracking-tight">Invitations</h1>

<!-- Tab Bar: "Received", "Sent". Sent tab is ACTIVE -->

<button class="flex-1 h-12 flex items-center justify-center font-button text-button text-[#55534D] hover:bg-[#F3F2EF] transition-colors relative" type="button">
        Received
      </button>
<button class="flex-1 h-12 flex items-center justify-center font-button text-button text-[#1C1B18] hover:bg-[#F3F2EF] transition-colors relative" type="button">
        Sent
        <!-- Active underline indicator -->
<div class="absolute bottom-0 left-0 right-0 h-[2px] bg-[#B23E00]"></div>
</button>
</nav>
<!-- Content: Sent tab view (Plain list rows, no cards) -->
<section class="flex-1 overflow-y-auto px-4 divide-y divide-[#D6D4CE]">
<!-- Row 1: Mai Pham (Declined) -->
<div class="py-4 flex items-center justify-between min-h-[64px]">
<div class="flex flex-col">
<span class="font-body text-body text-[#1C1B18] font-medium leading-tight">Mai Pham</span>
<span class="font-metadata text-metadata text-[#55534D] mt-0.5">MKT</span>
</div>
<!-- Status Chip: Declined -->
<div class="inline-flex items-center gap-1 h-8 px-3 rounded-full bg-[#F9DEDC] border border-[#B3261E] text-[#B3261E] shrink-0">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
<span class="font-chip text-chip text-[12px] leading-none">Declined</span>
</div>
</div>
<!-- Row 2: Minh Anh (Pending) -->
<div class="py-4 flex items-center justify-between min-h-[64px]">
<div class="flex flex-col">
<span class="font-body text-body text-[#1C1B18] font-medium leading-tight">Minh Anh</span>
<span class="font-metadata text-metadata text-[#55534D] mt-0.5">GD</span>
</div>

<span class="font-chip text-chip text-[12px] leading-none">Pending</span>
</div>
</div>

<span class="font-metadata text-metadata text-[#FFFFFF]">Declined</span>
<button class="font-button text-button text-[#FFE2D2] hover:opacity-90 active:opacity-75 transition-opacity px-2 py-1 -mr-2" type="button">
