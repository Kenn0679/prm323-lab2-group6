<body class="flex justify-center items-center min-h-screen p-0 m-0">
<!-- Mobile Frame Standard 360 x 800 dp -->
<div class="relative w-[360px] h-[800px] bg-surface-container-lowest flex flex-col overflow-hidden select-none">
<!-- Top App Bar -->
<header class="bg-surface-container-lowest flex items-center justify-between h-14 px-margin w-full shrink-0 z-10">
<div class="flex items-center">
<h1 class="font-title text-title text-on-surface">My team</h1>
</div>
<div class="flex items-center">
<!-- Optional contextual actions if needed, empty for clean alignment -->
</div>
</header>
<!-- Main Content Canvas (Vertically Centered Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin text-center pb-16">
<!-- Icon Module -->
<div class="w-16 h-16 rounded-full flex items-center justify-center mb-space-lg">
<span class="material-symbols-outlined text-[64px] text-on-surface-variant leading-none" data-icon="groups">groups</span>
</div>
<!-- State Headline -->
<h2 class="font-headline text-headline text-on-surface mb-space-sm">No team yet</h2>
<!-- Informational Description -->
<p class="font-metadata text-metadata text-on-surface-variant max-w-[260px] mb-space-xl">
        Assemble a dedicated unit or explore open vacancies to get started.
      </p>
<!-- Primary Action: Filled Button -->
<button class="w-full max-w-[280px] h-12 bg-primary-container hover:bg-primary active:opacity-80 transition-opacity duration-150 rounded-full flex items-center justify-center px-space-md mb-space-sm cursor-pointer border-none outline-none">
<span class="font-button text-button text-on-primary">Create team</span>
</button>
<!-- Secondary Action: Text Button (48dp Touch Target) -->
<button class="w-full max-w-[280px] h-12 flex items-center justify-center px-space-md rounded-full hover:bg-surface-container active:scale-95 transition-transform duration-150 cursor-pointer border-none bg-transparent outline-none">
<span class="font-button text-button text-on-surface-variant">Browse</span>
</button>
</main>
<!-- Bottom Navigation Bar (Docked Full Width, 4 Destinations, Flat) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-margin bg-surface-container-lowest">
<!-- Tab 1: Discover -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata min-w-[64px] min-h-[48px] hover:bg-surface-container-low active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="explore">explore</span>
<span class="mt-0.5">Discover</span>
</a>
<!-- Tab 2: Team (Active State) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 font-metadata text-metadata min-w-[64px] min-h-[48px] active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="groups">groups</span>
<span class="mt-0.5">Team</span>
</a>
<!-- Tab 3: Invitations -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata min-w-[64px] min-h-[48px] hover:bg-surface-container-low active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="mail">mail</span>
<span class="mt-0.5">Invitations</span>
</a>
<!-- Tab 4: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata min-w-[64px] min-h-[48px] hover:bg-surface-container-low active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
<span class="mt-0.5">Profile</span>
</a>
