<body class="bg-surface-container">
<!-- Mobile Frame Android 360 x 800 dp -->
<main class="w-[360px] h-[800px] bg-surface-container-lowest flex flex-col relative overflow-hidden select-none border border-surface-dim">
<!-- Top App Bar -->
<header class="w-full h-16 px-margin flex items-center bg-surface-container-lowest border-b border-surface-dim shrink-0 z-10">
<h1 class="font-title text-title text-on-surface">Profile</h1>
</header>
<!-- Scrollable Canvas Area -->
<div class="flex-1 overflow-y-auto px-margin pt-space-lg pb-space-lg flex flex-col gap-space-lg">
<!-- Profile Overview Card -->
<section class="bg-surface-container-lowest border border-[#D6D4CE] rounded-xl p-space-md flex flex-col gap-space-md">
<div class="flex items-center gap-space-md">
<!-- Initials Avatar -->
<div class="w-16 h-16 rounded-full bg-[#E9E7E2] flex items-center justify-center shrink-0">
<span class="font-title text-title text-custom-text">MN</span>
</div>
<!-- Name & Designation -->
<div class="flex flex-col">
<span class="font-title text-title text-custom-text">Minh Nguyen</span>
<span class="font-metadata text-metadata text-custom-muted">SE, S5</span>
</div>
</div>
<div class="h-[1px] bg-[#D6D4CE] w-full"></div>
<!-- Technical Competencies Chips -->
<div class="flex flex-col gap-space-xs">
<span class="font-metadata text-metadata text-custom-muted">Key skills</span>
<div class="flex flex-wrap gap-space-sm pt-space-xs">
<div class="h-8 px-space-md rounded-full bg-[#E9E7E2] border border-[#D6D4CE] flex items-center justify-center">
<span class="font-chip text-chip text-custom-text">Flutter</span>
</div>
<div class="h-8 px-space-md rounded-full bg-[#E9E7E2] border border-[#D6D4CE] flex items-center justify-center">
<span class="font-chip text-chip text-custom-text">Figma</span>
</div>
<div class="h-8 px-space-md rounded-full bg-[#E9E7E2] border border-[#D6D4CE] flex items-center justify-center">
<span class="font-chip text-chip text-custom-text">Python</span>
</div>
</div>
</div>
<div class="h-[1px] bg-[#D6D4CE] w-full"></div>
<!-- Weekly Availability -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs text-custom-muted">
<span class="material-symbols-outlined text-[20px]" data-icon="schedule">schedule</span>
<span class="font-metadata text-metadata text-custom-muted">Committed availability</span>
</div>
<span class="font-card-title text-card-title text-custom-text">15 h/week</span>
</div>
</section>
<!-- Preferences & Administrative Module -->
<section class="bg-surface-container-lowest border border-[#D6D4CE] rounded-xl p-space-md flex flex-col gap-space-md">
<h2 class="font-card-title text-card-title text-custom-text">Team preferences</h2>
<div class="flex flex-col gap-space-sm">
<div class="flex justify-between items-center text-custom-text py-space-xs">
<span class="font-metadata text-metadata text-custom-muted">Target project scope</span>
<span class="font-metadata text-metadata text-custom-text">Mobile &amp; Web systems</span>
</div>
<div class="h-[1px] bg-[#D6D4CE] w-full"></div>
<div class="flex justify-between items-center text-custom-text py-space-xs">
<span class="font-metadata text-metadata text-custom-muted">Primary role preference</span>
<span class="font-metadata text-metadata text-custom-text">Frontend developer</span>
</div>
</div>
</section>

<span class="material-symbols-outlined text-[24px]" data-icon="explore">explore</span>

</div>
<span class="font-button text-button text-[12px] leading-tight text-custom-pill-text mt-0.5">Profile</span>
</button>
