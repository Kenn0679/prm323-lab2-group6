<body class="bg-surface-container-lowest text-on-surface antialiased flex justify-center selection:bg-secondary-container">
<!-- 360 x 800 dp Mobile Frame -->
<div class="w-full max-w-[360px] min-h-[800px] h-screen flex flex-col bg-surface-container-lowest relative overflow-hidden select-none">
<!-- Top App Bar -->
<header class="h-14 px-margin w-full flex items-center justify-between bg-surface-container-lowest border-b border-surface-variant flex-shrink-0 z-10">
<div class="flex items-center">
<h1 class="font-title text-title text-on-surface">My team</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin pt-space-md pb-24 flex flex-col space-y-space-lg">
<!-- Primary Team Overview Card -->
<section class="bg-surface-container-lowest border border-card-border rounded-xl p-space-md flex flex-col space-y-space-md">
<!-- Title & Counter Meta -->
<div class="flex items-center justify-between">
<h2 class="font-card-title text-card-title text-on-surface">Tutor Match</h2>
<span class="font-label-field text-label-field text-subtext">5 of 5</span>
</div>
<!-- 5 Filled Square Slots (48dp x 48dp) -->
<div class="flex items-center justify-between w-full">
<!-- HN -->
<div class="w-12 h-12 rounded-xl bg-slot-bg border border-slot-border flex items-center justify-center flex-shrink-0">
<span class="font-label-field text-label-field text-slot-text font-bold">HN</span>
</div>
<!-- QB -->
<div class="w-12 h-12 rounded-xl bg-slot-bg border border-slot-border flex items-center justify-center flex-shrink-0">
<span class="font-label-field text-label-field text-slot-text font-bold">QB</span>
</div>
<!-- TL -->
<div class="w-12 h-12 rounded-xl bg-slot-bg border border-slot-border flex items-center justify-center flex-shrink-0">
<span class="font-label-field text-label-field text-slot-text font-bold">TL</span>
</div>
<!-- MP -->
<div class="w-12 h-12 rounded-xl bg-slot-bg border border-slot-border flex items-center justify-center flex-shrink-0">
<span class="font-label-field text-label-field text-slot-text font-bold">MP</span>
</div>
<!-- MA -->
<div class="w-12 h-12 rounded-xl bg-slot-bg border border-slot-border flex items-center justify-center flex-shrink-0">
<span class="font-label-field text-label-field text-slot-text font-bold">MA</span>
</div>
</div>
<!-- Status Check & Label -->
<div class="flex items-center space-x-space-xs pt-1">
<span class="material-symbols-outlined text-slot-border" style="font-size: 20px; font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-field text-label-field text-slot-border">Complete</span>
</div>
</section>
<!-- Members Section -->
<section class="flex flex-col space-y-space-sm">
<h3 class="font-card-title text-card-title text-on-surface">Members</h3>
<!-- Members Plain Frame Block -->
<div class="bg-surface-container-lowest border border-card-border rounded-xl divide-y divide-card-border overflow-hidden">
<div class="h-12 px-space-md flex items-center justify-between">
<span class="font-metadata text-metadata text-on-surface">Hoang Nguyen, SE</span>
</div>
<div class="h-12 px-space-md flex items-center justify-between">
<span class="font-metadata text-metadata text-on-surface">Quoc Bao, SE</span>
</div>
<div class="h-12 px-space-md flex items-center justify-between">
<span class="font-metadata text-metadata text-on-surface">Thao Linh, AI</span>
</div>
<div class="h-12 px-space-md flex items-center justify-between">
<span class="font-metadata text-metadata text-on-surface">Mai Pham, MKT</span>
</div>
<div class="h-12 px-space-md flex items-center justify-between">
<span class="font-metadata text-metadata text-on-surface">Minh Anh, GD</span>
</div>
</div>
</section>
<!-- Operational Action: Open chat -->
<div class="pt-space-xs">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-button text-button flex items-center justify-center active:opacity-90 transition-opacity" type="button">
          Open chat
        </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-margin bg-surface-container-lowest border-t border-surface-variant flex-shrink-0">
<!-- Tab: Discover (Inactive) -->
<button class="min-w-[48px] min-h-[48px] flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">explore</span>
<span class="text-[12px] leading-tight mt-0.5">Discover</span>
</button>
<!-- Tab: Team (Active) -->
<button class="min-w-[48px] min-h-[48px] flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 font-metadata text-metadata active:scale-95 transition-transform relative" type="button">
<span class="material-symbols-outlined" style="font-size: 22px; font-variation-settings: 'FILL' 1;">groups</span>
<span class="text-[12px] leading-tight font-semibold mt-0.5">Team</span>
<!-- Active underline indicator -->
<span class="absolute bottom-0 w-6 h-[2px] bg-primary-container rounded-full"></span>
</button>
<!-- Tab: Invitations (Inactive) -->
<button class="min-w-[48px] min-h-[48px] flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">mail</span>
<span class="text-[12px] leading-tight mt-0.5">Invitations</span>
</button>
<!-- Tab: Profile (Inactive) -->
<button class="min-w-[48px] min-h-[48px] flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">person</span>
<span class="text-[12px] leading-tight mt-0.5">Profile</span>
</button>
</nav>
</div>
