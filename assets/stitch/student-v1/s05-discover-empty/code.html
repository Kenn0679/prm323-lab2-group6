<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TeamUp EXE - Find a team</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "surface-container-high": "#ece7e2",
            "inverse-surface": "#32302d",
            "surface-container-low": "#f8f3ed",
            "surface-variant": "#e6e2dd",
            "inverse-on-surface": "#f5f0eb",
            "on-surface-variant": "#584239",
            "surface-container-highest": "#e6e2dd",
            "on-secondary-fixed": "#27180f",
            "tertiary-container": "#247242",
            "on-surface": "#1c1b18",
            "on-secondary-container": "#756053",
            "on-tertiary-container": "#a5f4b8",
            "on-tertiary": "#ffffff",
            "surface": "#fdf9f3",
            "inverse-primary": "#ffb59a",
            "surface-bright": "#fdf9f3",
            "surface-container": "#f2ede8",
            "error-container": "#ffdad6",
            "background": "#fdf9f3",
            "primary-fixed-dim": "#ffb59a",
            "primary-container": "#b23e00",
            "on-primary-container": "#ffdbcf",
            "surface-dim": "#ded9d4",
            "on-primary-fixed-variant": "#802a00",
            "on-tertiary-fixed-variant": "#005229",
            "tertiary": "#00592d",
            "on-error": "#ffffff",
            "secondary-container": "#faddcd",
            "secondary-fixed-dim": "#dcc1b2",
            "outline": "#8c7168",
            "secondary-fixed": "#faddcd",
            "outline-variant": "#e0c0b4",
            "primary": "#8a2e00",
            "on-tertiary-fixed": "#00210d",
            "on-background": "#1c1b18",
            "secondary": "#6f5a4e",
            "on-secondary-fixed-variant": "#564337",
            "on-primary-fixed": "#370e00",
            "on-primary": "#ffffff",
            "on-secondary": "#ffffff",
            "on-error-container": "#93000a",
            "tertiary-fixed": "#a5f4b8",
            "surface-tint": "#a73a00",
            "primary-fixed": "#ffdbce",
            "tertiary-fixed-dim": "#8ad79e"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-lg": "1.5rem",
            "space-sm": "0.5rem",
            "space-xl": "2rem",
            "margin": "1rem",
            "gutter": "1rem",
            "space-xs": "0.25rem",
            "space-md": "1rem"
          },
          "fontFamily": {
            "body": ["Be Vietnam Pro"],
            "metadata": ["Be Vietnam Pro"],
            "button": ["Be Vietnam Pro"],
            "headline": ["Be Vietnam Pro"],
            "card-title": ["Be Vietnam Pro"],
            "label-field": ["Be Vietnam Pro"],
            "chip": ["Be Vietnam Pro"],
            "title": ["Be Vietnam Pro"]
          },
          "fontSize": {
            "body": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "400" }],
            "metadata": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "400" }],
            "button": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "headline": ["24px", { "lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "700" }],
            "card-title": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "600" }],
            "label-field": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "chip": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "title": ["20px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "600" }]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      user-select: none;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface antialiased flex justify-center items-start min-h-screen">
<div class="relative w-[360px] h-[800px] max-h-[800px] bg-surface-container-lowest flex flex-col overflow-hidden border border-surface-variant">
<!-- Top App Bar -->
<header class="flex items-center justify-between h-14 px-margin w-full bg-surface-container-lowest text-on-surface select-none z-10">
<div class="flex items-center gap-space-sm">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:opacity-80 transition-opacity" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title text-title text-on-surface font-semibold tracking-tight">Find a team</h1>
</div>
<button aria-label="Search options" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:opacity-80 transition-opacity" type="button">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Query Inputs & Filter Row -->
<section class="px-margin pt-space-xs pb-space-sm flex flex-col gap-space-sm w-full">
<!-- Search Field with query text 'EdTech' -->
<div class="w-full flex items-center h-12 bg-surface-container-low border border-outline rounded-lg px-space-md gap-space-sm focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="search">search</span>
<input aria-label="Search for teams" class="w-full bg-transparent border-none p-0 font-body text-body text-on-surface focus:outline-none focus:ring-0 placeholder-on-surface-variant" placeholder="Search teams by focus or role..." type="text" value="EdTech">
<button aria-label="Clear search input" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="cancel">cancel</span>
</button>
</div>
<!-- Active Filter Chips -->
<div aria-label="Active filters" class="flex items-center gap-space-sm overflow-x-auto py-space-xs no-scrollbar" role="region">
<button class="inline-flex items-center justify-center h-8 pl-space-md pr-space-xs bg-secondary-fixed text-on-primary-fixed rounded-full font-chip text-chip whitespace-nowrap gap-space-xs flex-shrink-0 active:opacity-80" type="button">
<span class="">AI</span>
<span class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</span>
</button>
<button class="inline-flex items-center justify-center h-8 pl-space-md pr-space-xs bg-secondary-fixed text-on-primary-fixed rounded-full font-chip text-chip whitespace-nowrap gap-space-xs flex-shrink-0 active:opacity-80" type="button">
<span class="">Marketing</span>
<span class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</span>
</button>
</div>
</section>
<!-- Main Content Canvas / Centered Empty State -->
<main class="flex-1 px-margin flex flex-col items-center justify-center text-center pb-16">
<div class="w-20 h-20 rounded-full flex items-center justify-center bg-surface-container-low mb-space-lg text-outline">
<span class="material-symbols-outlined text-[44px]" data-icon="filter_list_off">filter_list_off</span>
</div>
<h2 class="font-headline text-headline text-on-surface mb-space-sm">No teams found</h2>
<p class="font-metadata text-metadata text-on-surface-variant max-w-[260px] mb-space-xl">Try fewer filters.</p>
<!-- The Single Primary Filled Button -->
<button class="h-12 px-space-xl bg-primary-container text-on-primary font-button text-button rounded-full inline-flex items-center justify-center active:opacity-90 transition-opacity" type="button">
        Clear filters
      </button>
</main>
<!-- Bottom Navigation Bar -->
<nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-margin bg-surface-container-lowest">
<!-- Discover (Active Tab) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 font-metadata text-metadata active:scale-95 transition-transform duration-150" href="#discover">
<span class="material-symbols-outlined text-[24px]" data-icon="explore">explore</span>
<span class="text-xs font-semibold mt-0.5">Discover</span>
</a>
<!-- Team -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata hover:bg-surface-container-low rounded-full active:scale-95 transition-transform duration-150" href="#team">
<span class="material-symbols-outlined text-[24px]" data-icon="groups">groups</span>
<span class="text-xs font-normal mt-0.5">Team</span>
</a>
<!-- Invitations -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata hover:bg-surface-container-low rounded-full active:scale-95 transition-transform duration-150" href="#invitations">
<span class="material-symbols-outlined text-[24px]" data-icon="mail">mail</span>
<span class="text-xs font-normal mt-0.5">Invitations</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata hover:bg-surface-container-low rounded-full active:scale-95 transition-transform duration-150" href="#profile">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
<span class="text-xs font-normal mt-0.5">Profile</span>
</a>
</nav>
</div>


</body></html>
