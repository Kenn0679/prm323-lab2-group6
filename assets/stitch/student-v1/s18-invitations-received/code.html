<body class="bg-surface-container-lowest text-on-surface flex justify-center items-center min-h-screen font-body select-none antialiased">
<!-- Mobile Screen Container 360 x 800 dp -->
<main class="w-[360px] h-[800px] bg-surface-container-lowest flex flex-col relative overflow-hidden">
<!-- Top App Bar -->
<header class="flex items-center justify-between h-14 px-margin w-full bg-surface-container-lowest shrink-0">
<h1 class="font-title text-title text-on-surface">Invitations</h1>
</header>
<!-- Operational Tab Bar -->
<nav class="flex border-b border-surface-variant w-full bg-surface-container-lowest shrink-0 px-margin">
<!-- Active Tab: Received -->
<button class="relative flex items-center justify-center gap-space-xs py-3 px-space-md text-on-surface font-label-field text-label-field border-b-2 border-primary-container -mb-[1px]">
<span>Received</span>
<span class="inline-flex items-center justify-center px-1.5 py-0.5 text-[11px] font-semibold leading-none rounded-full bg-secondary-container text-on-primary-fixed">2</span>
</button>
<!-- Inactive Tab: Sent -->
<button class="flex items-center justify-center py-3 px-space-md text-on-surface-variant font-label-field text-label-field">
<span>Sent</span>
</button>
</nav>
<!-- Content Area: Plain Flat Rows (No Cards) -->
<section class="flex-1 flex flex-col px-margin pt-space-xs overflow-y-auto">
<!-- Row 1: GreenLoop -->
<article class="flex items-center justify-between py-4 border-b border-surface-variant">
<div class="flex flex-col">
<span class="font-card-title text-card-title text-on-surface">GreenLoop</span>
<span class="font-metadata text-metadata text-on-surface-variant">AI</span>
</div>
<div class="flex items-center gap-space-sm">
<button class="h-12 px-3 inline-flex items-center justify-center font-button text-button text-error active:opacity-80 transition-opacity" type="button">
            Decline
          </button>
<button class="h-12 px-4 inline-flex items-center justify-center rounded-full bg-surface-container-highest border border-surface-variant font-button text-button text-on-surface active:bg-surface-container transition-colors" type="button">
            Accept
          </button>
</div>
</article>
<!-- Row 2: FinLite -->
<article class="flex items-center justify-between py-4 border-b border-surface-variant">
<div class="flex flex-col">
<span class="font-card-title text-card-title text-on-surface">FinLite</span>
<span class="font-metadata text-metadata text-on-surface-variant">Design</span>
</div>
<div class="flex items-center gap-space-sm">
<button class="h-12 px-3 inline-flex items-center justify-center font-button text-button text-error active:opacity-80 transition-opacity" type="button">
            Decline
          </button>
<button class="h-12 px-4 inline-flex items-center justify-center rounded-full bg-surface-container-highest border border-surface-variant font-button text-button text-on-surface active:bg-surface-container transition-colors" type="button">
            Accept
          </button>
</div>
</article>
</section>
<!-- Bottom Navigation Bar (Fixed 4 destinations, "Invitations" active) -->
<nav class="w-full h-16 bg-surface-container-lowest border-t border-surface-variant flex justify-around items-center px-margin shrink-0">
<!-- Discover -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 font-metadata text-metadata h-12">
<span class="material-symbols-outlined text-[20px]" data-icon="explore">explore</span>
<span class="text-[11px] leading-tight mt-0.5">Discover</span>
</button>

<button class="flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 font-metadata text-metadata h-12">
