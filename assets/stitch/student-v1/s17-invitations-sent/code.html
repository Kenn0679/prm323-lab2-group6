<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface flex justify-center items-start min-h-screen">
<!-- Mobile Viewport Frame (360 x 800 dp) -->
<main class="w-[360px] h-[800px] max-h-[800px] bg-surface-container-lowest flex flex-col relative overflow-hidden select-none">
<!-- Top App Bar -->
<header class="h-14 px-margin flex items-center justify-start bg-surface-container-lowest border-b border-surface-variant flex-shrink-0">
<h1 class="font-title text-title text-on-surface tracking-tight">Invitations</h1>
</header>
<!-- Navigation Segmented Tabs (Under App Bar) -->
<section class="px-margin pt-3 pb-3 flex items-center gap-2 border-b border-surface-variant bg-surface-container-lowest flex-shrink-0">
<!-- Inactive Tab: Received -->
<button class="h-8 px-4 rounded-full bg-surface-container border border-surface-variant text-on-surface font-chip text-chip flex items-center justify-center transition-colors" type="button">
        Received
      </button>
<!-- Active Tab: Sent -->
<button class="h-8 px-4 rounded-full bg-secondary-container text-on-primary-fixed font-chip text-chip flex items-center justify-center" type="button">
        Sent
      </button>
</section>
<!-- Content List Canvas -->
<section class="flex-1 overflow-y-auto px-margin">
<div class="flex flex-col">
<!-- Row 1: Tutor Match -->
<div class="py-4 border-b border-surface-variant flex items-center justify-between min-h-[72px]">
<div class="flex flex-col pr-2">
<span class="font-card-title text-card-title text-on-surface">Tutor Match</span>
<span class="font-metadata text-metadata text-secondary mt-0.5">SE</span>
</div>
<div class="flex-shrink-0">
<!-- Chip Pending -->
<span class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full bg-surface-container border border-surface-variant text-on-surface font-chip text-chip">
<span class="material-symbols-outlined text-[18px] text-secondary leading-none" data-icon="schedule">schedule</span>
<span>Pending</span>
</span>
</div>
</div>
<!-- Row 2: AgriSense IoT -->
<div class="py-4 border-b border-surface-variant flex items-center justify-between min-h-[72px]">
<div class="flex flex-col pr-2">
<span class="font-card-title text-card-title text-on-surface">AgriSense IoT</span>
<span class="font-metadata text-metadata text-secondary mt-0.5">Mobile</span>
</div>
<div class="flex-shrink-0">
<!-- Chip Accepted -->
<span class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full bg-[#D6F0DD] border border-[#1B6B3C] text-[#07301A] font-chip text-chip">
<span class="material-symbols-outlined text-[18px] text-[#1B6B3C] leading-none" data-icon="check">check</span>
<span>Accepted</span>
</span>
</div>
</div>
<!-- Row 3: EduQuest AR -->
<div class="py-4 border-b border-surface-variant flex items-center justify-between min-h-[72px]">
<div class="flex flex-col pr-2">
<span class="font-card-title text-card-title text-on-surface">EduQuest AR</span>
<span class="font-metadata text-metadata text-secondary mt-0.5">AI</span>
</div>
<div class="flex-shrink-0">
<!-- Chip Declined -->
<span class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full bg-error-container border border-error text-on-error-container font-chip text-chip">
<span class="material-symbols-outlined text-[18px] text-error leading-none" data-icon="close">close</span>
<span>Declined</span>
</span>
</div>
</div>
</div>
</section>
<!-- Snackbar Layer (Docked directly above the bottom navigation bar) -->
<aside class="absolute left-margin right-margin bottom-[72px] z-40">
<div class="h-12 bg-inverse-surface rounded-lg px-4 flex items-center justify-between shadow-none">
<span class="font-metadata text-metadata text-on-error">Sent</span>
<button class="font-button text-button text-primary-fixed-dim hover:text-primary-fixed active:opacity-80 transition-opacity" type="button">
          Undo
        </button>
</div>
</aside>
<!-- Bottom Navigation Bar (Fixed 64dp, 4 Destinations) -->
<nav class="h-16 w-full bg-surface-container-lowest border-t border-surface-variant flex items-center justify-around px-margin z-50 flex-shrink-0">
<!-- Tab 1: Discover (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 font-metadata text-metadata hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-0.5 leading-none" data-icon="explore">explore</span>
<span>Discover</span>
</a>
<!-- Tab 2: Team (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 font-metadata text-metadata hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-0.5 leading-none" data-icon="groups">groups</span>
<span>Team</span>
</a>
<!-- Tab 3: Invitations (Active Pill) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 font-metadata text-metadata" href="#">
<span class="material-symbols-outlined mb-0.5 leading-none text-on-primary-fixed" data-icon="mail">mail</span>
<span class="font-semibold text-on-primary-fixed">Invitations</span>
</a>
<!-- Tab 4: Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 font-metadata text-metadata hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-0.5 leading-none" data-icon="person">person</span>
<span>Profile</span>
</a>
</nav>
</main>
</body></html>
