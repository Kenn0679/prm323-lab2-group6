<body class="bg-surface-container-high flex justify-center items-center min-h-screen m-0 p-0 antialiased selection:bg-secondary-container">
<!-- Mobile Frame: 360 x 800 dp -->
<div class="relative w-[360px] h-[800px] bg-surface-container-lowest flex flex-col overflow-hidden border border-surface-dim">
<!-- Top App Bar -->
<header class="bg-surface-container-lowest border-b border-surface-dim h-16 w-full px-margin flex items-center justify-between shrink-0 z-10">
<div class="flex items-center gap-space-sm">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low transition-colors duration-150 active:opacity-80 active:scale-95 text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-title text-title text-on-surface">Tutor Match chat</h1>
</div>
</header>
<!-- Chat Canvas / Message Content -->
<main class="flex-1 overflow-y-auto px-margin py-space-lg flex flex-col space-y-space-md">
<!-- Date Indicator -->
<div class="flex justify-center my-space-xs">
<span class="font-metadata text-metadata text-secondary">Today</span>
</div>
<!-- Bubble 1: Incoming -->
<div class="flex flex-col items-start max-w-[85%] self-start">
<div class="bg-surface-container text-on-surface font-body text-body px-space-md py-space-sm rounded-xl rounded-tl-none border border-surface-dim">
          Welcome to the team, Mai!
        </div>
<span class="font-metadata text-metadata text-secondary mt-1 px-1">10:14 am</span>
</div>
<!-- Bubble 2: Outgoing -->
<div class="flex flex-col items-end max-w-[85%] self-end">
<div class="bg-primary-container text-on-primary font-body text-body px-space-md py-space-sm rounded-xl rounded-tr-none">
          Thanks! I can start this week.
        </div>
<span class="font-metadata text-metadata text-secondary mt-1 px-1">10:15 am</span>
</div>
<!-- Bubble 3: Incoming -->
<div class="flex flex-col items-start max-w-[85%] self-start">
<div class="bg-surface-container text-on-surface font-body text-body px-space-md py-space-sm rounded-xl rounded-tl-none border border-surface-dim">
          Great, let's meet Thursday.
        </div>
<span class="font-metadata text-metadata text-secondary mt-1 px-1">10:16 am</span>
</div>
</main>
<!-- Bottom Input Area Docked at Bottom -->
<footer class="bg-surface-container-lowest border-t border-surface-dim p-margin shrink-0 z-10">
<form class="flex items-center gap-space-sm" onsubmit="event.preventDefault()">
<div class="relative flex-1">
<input class="w-full h-12 bg-surface-container border border-outline rounded-lg px-space-md font-body text-body text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary transition-colors" placeholder="Message" type="text"/>
</div>
<button aria-label="Send message" class="w-12 h-12 shrink-0 flex items-center justify-center rounded-full border border-surface-dim hover:bg-surface-container-low transition-colors duration-150 active:opacity-80 active:scale-95 text-on-surface" type="submit">
<span class="material-symbols-outlined text-[24px]">send</span>
</button>
</form>
</footer>
</div>
