        </button>

<span>Sent</span>
<span class="absolute bottom-0 left-0 right-0 h-[2px] bg-[#B23E00]"></span>
</button>
</nav>
</header>

<main class="flex-1 w-full px-4 pt-2 overflow-y-auto">
<!-- Row 1: Mai Pham (Accepted) -->
<div class="flex items-center justify-between py-4 border-b border-[#D6D4CE] min-h-[48px]">

</div>
<div class="h-8 px-3 rounded-full bg-[#D6F0DD] border border-[#1B6B3C] flex items-center gap-1.5 self-center">
<span class="material-symbols-outlined text-[18px] text-[#07301A]" data-icon="check">check</span>
<span class="font-chip text-chip text-[#07301A]">Accepted</span>
</div>
</div>
<!-- Row 2: Minh Anh (Pending) -->
<div class="flex items-center justify-between py-4 border-b border-[#D6D4CE] min-h-[48px]">
<div class="flex flex-col">
<span class="font-body text-body text-[#1C1B18]">Minh Anh</span>

<span class="font-chip text-chip text-[#1C1B18]">Pending</span>
</div>
</div>
