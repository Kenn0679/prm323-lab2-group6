<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create profile</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      darkMode: "class",

            "on-surface": "#1c1b18",
            "on-secondary-container": "#756053",
            "on-tertiary-container": "#a5f4b8",
            "on-tertiary": "#ffffff",
            "surface": "#fdf9f3",
            "inverse-primary": "#ffb59a",
            "surface-bright": "#fdf9f3",
            "surface-container": "#f2ede8",

            "button": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
            "headline": ["24px", {"lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "700"}],
            "card-title": ["16px", {"lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "600"}],
            "label-field": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
            "chip": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
            "title": ["20px", {"lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "600"}]

<style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f2ede8;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    /* Enforce elimination of shadows */
    * {
      box-shadow: none !important;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-on-surface">
<!-- Mobile Frame: 360 x 800 dp -->
<main class="w-full max-w-[360px] h-[800px] bg-app-white flex flex-col relative overflow-hidden border border-outline-variant select-none">
<!-- Top App Bar (Nested Screen: Leading Back Arrow, Title, No Nav Shell) -->
<header class="bg-surface-container-lowest h-14 w-full flex items-center px-margin border-b border-surface-variant flex-shrink-0 z-10">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container active:opacity-80 transition-opacity duration-150 text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title text-title text-on-surface ml-1 font-semibold">Create profile</h1>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-margin pt-4 pb-24 space-y-4">
<!-- Major Field -->
<section class="flex flex-col">
<label class="font-label-field text-label-field text-on-surface mb-2" for="input-major">Major</label>
<div class="h-12 bg-app-input-bg border border-outline rounded-lg px-3 flex items-center">
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-on-surface focus:ring-0 focus:outline-none cursor-default" id="input-major" readonly="" type="text" value="Software Engineering"/>
</div>
</section>
<!-- Semester Field -->
<section class="flex flex-col">
<label class="font-label-field text-label-field text-on-surface mb-2" for="input-semester">Semester</label>
<div class="h-12 bg-app-input-bg border border-outline rounded-lg px-3 flex items-center justify-between">
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-on-surface focus:ring-0 focus:outline-none cursor-default" id="input-semester" readonly="" type="text" value="Fall 2026"/>
<span class="material-symbols-outlined text-[20px] text-outline ml-2 pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</section>
<!-- Skills Section -->
<section class="flex flex-col pt-1">
<div class="flex items-center justify-between mb-2">
<label class="font-label-field text-label-field text-on-surface">Skills</label>
<span class="font-metadata text-metadata text-on-surface-variant">1 selected</span>
</div>
<!-- Chips Flow -->
<div class="flex flex-wrap gap-2">
<!-- Selected: Flutter -->
<div class="h-12 flex items-center">
<button class="h-8 px-4 rounded-full bg-app-chip-selected text-app-chip-selected-text font-chip text-chip flex items-center justify-center active:opacity-80 transition-opacity" type="button">
              Flutter
            </button>
</div>
<!-- Unselected: Figma -->
<div class="h-12 flex items-center">
<button class="h-8 px-4 rounded-full bg-app-chip-unselected border border-app-chip-border text-on-surface font-chip text-chip flex items-center justify-center active:opacity-80 transition-opacity" type="button">
              Figma
            </button>
</div>
<!-- Unselected: Marketing -->
<div class="h-12 flex items-center">
<button class="h-8 px-4 rounded-full bg-app-chip-unselected border border-app-chip-border text-on-surface font-chip text-chip flex items-center justify-center active:opacity-80 transition-opacity" type="button">
              Marketing
            </button>
</div>
<!-- Unselected: Node.js -->
<div class="h-12 flex items-center">
<button class="h-8 px-4 rounded-full bg-app-chip-unselected border border-app-chip-border text-on-surface font-chip text-chip flex items-center justify-center active:opacity-80 transition-opacity" type="button">
              Node.js
            </button>
</div>
<!-- Unselected: Python -->
<div class="h-12 flex items-center">
<button class="h-8 px-4 rounded-full bg-app-chip-unselected border border-app-chip-border text-on-surface font-chip text-chip flex items-center justify-center active:opacity-80 transition-opacity" type="button">
              Python
            </button>
</div>
</div>
<!-- Error under Skills -->
<div class="mt-2 bg-app-error-bg rounded-lg px-3 py-2 flex items-center space-x-2 border border-app-error-text/20" role="alert">
<span class="material-symbols-outlined text-app-error-text text-[18px] flex-shrink-0" data-icon="error">error</span>
<p class="font-metadata text-metadata text-app-error-text font-medium leading-none">Pick 3 skills</p>
</div>
</section>
<!-- Role Field -->
<section class="flex flex-col pt-1">
<label class="font-label-field text-label-field text-on-surface mb-2" for="input-role">Role</label>
<div class="h-12 bg-app-input-bg border border-outline rounded-lg px-3 flex items-center justify-between">
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-on-surface focus:ring-0 focus:outline-none cursor-default" id="input-role" readonly="" type="text" value="Mobile"/>
<span class="material-symbols-outlined text-[20px] text-outline ml-2 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</section>
<!-- Availability Field -->
<section class="flex flex-col pt-1">
<label class="font-label-field text-label-field text-on-surface mb-2" for="input-availability">Availability</label>
<div class="h-12 bg-app-input-bg border border-outline rounded-lg px-3 flex items-center justify-between">
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-on-surface focus:ring-0 focus:outline-none cursor-default" id="input-availability" readonly="" type="text" value="15 h/week"/>
<span class="material-symbols-outlined text-[20px] text-outline ml-2 pointer-events-none" data-icon="schedule">schedule</span>
</div>
</section>
</div>
<!-- Sticky Bottom Container for Save profile action -->
<footer class="absolute bottom-0 left-0 w-full bg-app-white border-t border-outline-variant p-margin flex items-center z-20">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-full font-button text-button flex items-center justify-center active:opacity-90 transition-opacity" type="button">
        Save profile
      </button>
</footer>
</main>
</body></html>
