<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Proposal detail - hand-built</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-container": "#a5f4b8",
            "on-background": "#1c1b18",
            "surface-dim": "#ded9d4",
            "on-tertiary-fixed": "#00210d",
            "surface-tint": "#a73a00",
            "outline-variant": "#e0c0b4",
            "tertiary": "#00592d",
            "primary-container": "#b23e00",
            "primary": "#8a2e00",
            "on-surface-variant": "#584239",
            "surface-container-low": "#f8f3ed",
            "on-secondary-fixed-variant": "#564337",
            "primary-fixed": "#ffdbce",
            "surface": "#fdf9f3",
            "inverse-primary": "#ffb59a",
            "surface-variant": "#e6e2dd",
            "on-tertiary": "#ffffff",
            "error-container": "#ffdad6",
            "error": "#ba1a1a",
            "on-primary-fixed": "#370e00",
            "secondary-fixed-dim": "#dcc1b2",
            "on-surface": "#1c1b18",
            "surface-container-lowest": "#ffffff",
            "secondary-container": "#faddcd",
            "on-secondary": "#ffffff",
            "on-primary-container": "#ffdbcf",
            "on-primary": "#ffffff",
            "background": "#fdf9f3",
            "secondary-fixed": "#faddcd",
            "inverse-on-surface": "#f5f0eb",
            "inverse-surface": "#32302d",
            "secondary": "#6f5a4e",
            "tertiary-fixed-dim": "#8ad79e",
            "tertiary-fixed": "#a5f4b8",
            "on-secondary-fixed": "#27180f",
            "primary-fixed-dim": "#ffb59a",
            "surface-container": "#f2ede8",
            "tertiary-container": "#247242",
            "on-error-container": "#93000a",
            "on-primary-fixed-variant": "#802a00",
            "surface-bright": "#fdf9f3",
            "surface-container-high": "#ece7e2",
            "on-secondary-container": "#756053",
            "on-error": "#ffffff",
            "on-tertiary-fixed-variant": "#005229",
            "outline": "#8c7168",
            "surface-container-highest": "#e6e2dd"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-xl": "2rem",
            "gutter": "1rem",
            "margin": "1rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-sm": "0.5rem",
            "space-xs": "0.25rem"
          },
          "fontFamily": {
            "metadata": ["Be Vietnam Pro"],
            "card-title": ["Be Vietnam Pro"],
            "chip": ["Be Vietnam Pro"],
            "label-field": ["Be Vietnam Pro"],
            "title": ["Be Vietnam Pro"],
            "button": ["Be Vietnam Pro"],
            "body": ["Be Vietnam Pro"],
            "headline": ["Be Vietnam Pro"]
          },
          "fontSize": {
            "metadata": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "400" }],
            "card-title": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "600" }],
            "chip": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "label-field": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "title": ["20px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "600" }],
            "button": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
            "body": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "400" }],
            "headline": ["24px", { "lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "700" }]
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #F3F2EF;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen sm:py-6">
<!-- Mobile Viewport Frame (360x800 dp) -->
<main class="w-[360px] h-[800px] max-h-[800px] bg-[#FFFFFF] flex flex-col justify-between relative overflow-hidden text-[#1C1B18] shadow-none">
<!-- Top App Bar -->
<header class="w-full h-14 px-margin flex items-center bg-[#FFFFFF] shrink-0 border-b border-[#D6D4CE]">
<button aria-label="Go back" class="w-12 h-12 -ml-2 flex items-center justify-center rounded-full text-[#1C1B18] hover:bg-[#E9E7E2] transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-title font-title text-[#1C1B18] ml-1 tracking-tight">FinLite</h1>
</header>
<!-- Scrollable Body Canvas -->
<div class="flex-1 overflow-y-auto px-margin pt-space-lg pb-4 flex flex-col">
<!-- Signature Major Row Component: 5 Filled Slots -->
<section aria-label="Role allocation" class="w-full flex justify-between items-center">
<!-- Slot 1: SE -->
<div class="w-[48px] h-[48px] rounded-[12px] bg-[#D6F0DD] border border-[#1B6B3C] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-[#07301A]">SE</span>
</div>
<!-- Slot 2: SE -->
<div class="w-[48px] h-[48px] rounded-[12px] bg-[#D6F0DD] border border-[#1B6B3C] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-[#07301A]">SE</span>
</div>
<!-- Slot 3: MKT -->
<div class="w-[48px] h-[48px] rounded-[12px] bg-[#D6F0DD] border border-[#1B6B3C] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-[#07301A]">MKT</span>
</div>
<!-- Slot 4: GD -->
<div class="w-[48px] h-[48px] rounded-[12px] bg-[#D6F0DD] border border-[#1B6B3C] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-[#07301A]">GD</span>
</div>
<!-- Slot 5: AI -->
<div class="w-[48px] h-[48px] rounded-[12px] bg-[#D6F0DD] border border-[#1B6B3C] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-[#07301A]">AI</span>
</div>
</section>
<!-- Status Chip Below Slots -->
<div class="mt-space-md flex">
<div class="inline-flex items-center gap-space-xs h-[32px] px-3 rounded-full bg-[#E9E7E2] border border-[#D6D4CE]">
<span class="material-symbols-outlined text-[18px] text-[#1C1B18]">person</span>
<span class="text-chip font-chip text-[#1C1B18]">Added by you</span>
</div>
</div>
<!-- Section "New member" -->
<section class="mt-space-lg">
<h2 class="text-card-title font-card-title text-[#1C1B18] mb-space-sm">New member</h2>
<div class="flex items-center justify-between py-2 border-b border-[#D6D4CE]">
<span class="text-body font-body text-[#1C1B18]">Lan Vo, AI</span>
<button class="h-9 px-4 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-[#1C1B18] text-button font-button flex items-center justify-center hover:bg-[#ded9d4] active:scale-[0.98] transition-all" type="button">
            Change
          </button>
</div>
</section>
<!-- Section "Members" -->
<section class="mt-space-lg">
<h2 class="text-card-title font-card-title text-[#1C1B18] mb-space-sm">Members</h2>
<div class="flex flex-col">
<!-- Member 1 -->
<div class="py-3 border-b border-[#D6D4CE]">
<span class="text-body font-body text-[#1C1B18]">Hoang Nguyen, SE</span>
</div>
<!-- Member 2 -->
<div class="py-3 border-b border-[#D6D4CE]">
<span class="text-body font-body text-[#1C1B18]">Quoc Bao, SE</span>
</div>
<!-- Member 3 -->
<div class="py-3 border-b border-[#D6D4CE]">
<span class="text-body font-body text-[#1C1B18]">Thao Linh, MKT</span>
</div>
<!-- Member 4 -->
<div class="py-3">
<span class="text-body font-body text-[#1C1B18]">Duc Pham, GD</span>
</div>
</div>
</section>
</div>
<!-- Sticky Bottom Action Area -->
<footer class="w-full px-margin pb-6 pt-3 bg-[#FFFFFF] border-t border-[#D6D4CE] flex flex-col items-center shrink-0">
<!-- Filled Primary Button -->
<button class="w-full h-12 rounded-full bg-[#B23E00] text-[#FFFFFF] text-button font-button flex items-center justify-center hover:bg-opacity-95 active:scale-[0.98] transition-all focus:outline-none" type="button">
        Approve
      </button>
<!-- Text Button Discard -->
<button class="w-full h-12 mt-1 rounded-full text-[#B3261E] text-button font-button flex items-center justify-center hover:bg-[#F9DEDC]/40 active:scale-[0.98] transition-all focus:outline-none" type="button">
        Discard
      </button>
</footer>
</main>
</body></html>
