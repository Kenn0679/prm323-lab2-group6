<!DOCTYPE html>

<html class="light" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f2ede8;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- Mobile Viewport Canvas (360 x 800 dp) -->
<main class="w-[360px] h-[800px] bg-surface-container-lowest flex flex-col relative overflow-hidden">
<!-- Top App Bar -->
<header class="flex items-center w-full h-14 px-margin bg-surface-container-lowest border-b border-surface-container-highest flex-shrink-0 z-10">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 -ml-2 text-on-surface hover:bg-surface-container-low transition-colors duration-150 rounded-full" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-title font-title text-on-surface ml-1 tracking-tight">Add student</h1>
</header>
<!-- Content Workspace -->
<div class="flex flex-col flex-1 px-margin pt-space-md pb-space-lg overflow-y-auto">
<!-- Search Input Field (56dp height, 8dp radius, fill #F3F2EF, border #77756F) -->
<section aria-label="Student search" class="w-full flex-shrink-0">
<div class="flex items-center w-full h-14 bg-[#F3F2EF] border border-[#77756F] rounded-lg px-3">
<div class="flex items-center justify-center w-6 h-6 text-[#55534D] flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">search</span>
</div>
<input aria-label="Search student by name or ID" class="flex-1 bg-transparent border-0 focus:ring-0 focus:outline-none px-2.5 text-body font-body text-on-surface placeholder-[#55534D]" id="student-search-input" type="text" value="Zed"/>
<button aria-label="Clear search input" class="flex items-center justify-center w-10 h-10 text-[#55534D] hover:text-on-surface transition-colors duration-150 rounded-full" id="clear-search-icon-btn" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</section>
<!-- Department / Specialty Filter Chips Row -->
<nav aria-label="Filter departments" class="flex items-center gap-space-xs mt-space-md overflow-x-auto no-scrollbar flex-shrink-0">
<!-- "All" (Selected) -->
<button aria-pressed="true" class="flex items-center justify-center h-9 px-4 rounded-full bg-[#FFE2D2] text-[#3B1400] text-chip font-chip transition-colors duration-150 whitespace-nowrap" type="button">
          All
        </button>
<!-- "SE" (Unselected) -->
<button aria-pressed="false" class="flex items-center justify-center h-9 px-4 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip hover:bg-surface-container-high transition-colors duration-150 whitespace-nowrap" type="button">
          SE
        </button>
<!-- "AI" (Unselected) -->
<button aria-pressed="false" class="flex items-center justify-center h-9 px-4 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip hover:bg-surface-container-high transition-colors duration-150 whitespace-nowrap" type="button">
          AI
        </button>
<!-- "MKT" (Unselected) -->
<button aria-pressed="false" class="flex items-center justify-center h-9 px-4 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip hover:bg-surface-container-high transition-colors duration-150 whitespace-nowrap" type="button">
          MKT
        </button>
<!-- "GD" (Unselected) -->
<button aria-pressed="false" class="flex items-center justify-center h-9 px-4 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip hover:bg-surface-container-high transition-colors duration-150 whitespace-nowrap" type="button">
          GD
        </button>
</nav>
<!-- Empty Results State (Vertically Centered in Available Space) -->
<section aria-live="polite" class="flex-1 flex flex-col items-center justify-center text-center px-4">
<!-- 48dp Outlined search_off icon in #77756F -->
<div class="flex items-center justify-center w-16 h-16 mb-space-sm text-[#77756F]">
<span class="material-symbols-outlined text-[48px] leading-none">search_off</span>
</div>
<!-- Headline / Title -->
<h2 class="text-card-title font-card-title text-on-surface mt-1 mb-space-lg">
          No student found
        </h2>
<!-- Tonal Pill Action Button (Height 48dp, fill #E9E7E2, border 1dp #D6D4CE, text #1C1B18) -->
<button class="flex items-center justify-center h-12 px-6 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-button font-button hover:bg-surface-container-high active:scale-[0.98] transition-all duration-150" id="clear-search-btn" type="button">
          Clear search
        </button>
</section>
</div>
</main>
<script>
    const searchInput = document.getElementById('student-search-input');
    const clearIconBtn = document.getElementById('clear-search-icon-btn');
    const clearActionBtn = document.getElementById('clear-search-btn');

    function resetSearch() {
      if (searchInput) {
        searchInput.value = '';
        searchInput.focus();
      }
    }

    if (clearIconBtn) {
      clearIconBtn.addEventListener('click', resetSearch);
    }

    if (clearActionBtn) {
      clearActionBtn.addEventListener('click', resetSearch);
    }
  </script>
</body></html>
