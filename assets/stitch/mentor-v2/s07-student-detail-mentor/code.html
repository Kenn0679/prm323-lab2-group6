<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student detail</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-container": "#a5f4b8",

            "surface-container-lowest": "#ffffff",
            "on-primary": "#ffffff",

            "surface-container": "#f2ede8",
            "error": "#ba1a1a",
            "on-secondary-fixed-variant": "#564337",
            "inverse-surface": "#32302d",
            "outline-variant": "#d6d4ce",
            "tertiary-fixed-dim": "#8ad79e",
            "outline": "#77756f",
            "surface-variant": "#e6e2dd",
            "on-background": "#1c1b18",
            "on-tertiary-fixed": "#00210d",
            "tertiary-fixed": "#a5f4b8",
            "inverse-on-surface": "#f5f0eb",
            "secondary-fixed-dim": "#dcc1b2",
            "surface-container-highest": "#e6e2dd",
            "secondary-fixed": "#faddcd",
            "tertiary": "#00592d",
            "surface-container-high": "#ece7e2",
            "background": "#ffffff",
            "on-primary-fixed": "#370e00",
            "primary-fixed-dim": "#ffb59a",
            "primary": "#8a2e00",
            "on-error-container": "#93000a",
            "on-primary-fixed-variant": "#802a00",
            "surface-tint": "#a73a00",
            "on-secondary-container": "#756053",
            "on-secondary": "#ffffff",
            "on-tertiary": "#ffffff",
            "tertiary-container": "#247242",
            "on-error": "#ffffff",
            "primary-container": "#b23e00",
            "on-surface-variant": "#55534d",
            "error-container": "#ffdad6",
            "on-primary-container": "#ffdbcf",
            "surface-dim": "#ded9d4",
            "on-tertiary-fixed-variant": "#005229",
            "secondary": "#6f5a4e",
            "on-surface": "#1c1b18",
            "on-secondary-fixed": "#27180f",
            "secondary-container": "#faddcd",
            "surface": "#ffffff",
            "primary-fixed": "#ffdbce",
            "surface-bright": "#ffffff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-lg": "1.5rem",
            "gutter": "1rem",
            "space-sm": "0.5rem",
            "space-xl": "2rem",
            "space-xs": "0.25rem",
            "space-md": "1rem",
            "margin": "1rem"
          },
          "fontFamily": {
            "body": ["Be Vietnam Pro"],
            "metadata": ["Be Vietnam Pro"],
            "headline": ["Be Vietnam Pro"],
            "title": ["Be Vietnam Pro"],
            "button": ["Be Vietnam Pro"],
            "chip": ["Be Vietnam Pro"],
            "card-title": ["Be Vietnam Pro"],
            "label-field": ["Be Vietnam Pro"]
          },
          "fontSize": {
            "body": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "400" }],
            "metadata": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "400" }],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-highest text-on-surface flex justify-center items-center min-h-screen font-body antialiased selection:bg-secondary-container selection:text-on-surface">
<!-- Mobile Screen Canvas (360x800 Frame) -->
<main class="w-[360px] h-[800px] bg-surface relative flex flex-col overflow-hidden border border-outline-variant">
<!-- Top App Bar (Nested Screen Navigation) -->
<header class="flex items-center w-full px-margin h-12 bg-surface border-b border-outline-variant shrink-0 z-10">
<button aria-label="Back" class="w-12 h-12 -ml-3 flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-title font-title text-on-surface ml-1 tracking-tight truncate">
        Mai Pham
      </h1>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-margin pt-space-lg pb-space-xl flex flex-col space-y-space-lg">
<!-- Student Header Meta Card Area -->
<section class="flex flex-col items-start border border-outline-variant rounded-xl p-space-md bg-surface">
<div class="flex items-center space-x-space-md w-full">
<!-- Circular initials avatar: fill #E9E7E2, text #1C1B18 -->
<div class="w-14 h-14 rounded-full bg-[#E9E7E2] flex items-center justify-center shrink-0">
<span class="text-card-title font-card-title text-on-surface">MP</span>
</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<div class="text-card-title font-card-title text-on-surface truncate">
              Mai Pham
            </div>
<div class="text-metadata font-metadata text-on-surface-variant truncate">
              MKT, S5
            </div>
</div>
</div>
<div class="w-full h-[1px] bg-outline-variant my-space-md"></div>
<!-- Status Chip: No team -->
<div class="flex items-center space-x-space-xs px-3 h-8 rounded-full bg-[#E9E7E2] border border-outline-variant">
<span class="material-symbols-outlined text-[18px] text-on-surface" data-icon="person_remove">person_remove</span>
<span class="text-chip font-chip text-on-surface">No team</span>
</div>
</section>
<!-- Skills Section -->
<section class="flex flex-col border border-outline-variant rounded-xl p-space-md bg-surface">
<h2 class="text-card-title font-card-title text-on-surface mb-space-sm">
          Skills
        </h2>
<div class="flex flex-wrap gap-space-sm pt-space-xs">
<!-- Social media -->
<span class="inline-flex items-center h-8 px-space-md rounded-full bg-[#E9E7E2] border border-outline-variant text-chip font-chip text-on-surface">
            Social media
          </span>
<!-- Branding -->
<span class="inline-flex items-center h-8 px-space-md rounded-full bg-[#E9E7E2] border border-outline-variant text-chip font-chip text-on-surface">
            Branding
          </span>
<!-- Writing -->
<span class="inline-flex items-center h-8 px-space-md rounded-full bg-[#E9E7E2] border border-outline-variant text-chip font-chip text-on-surface">
            Writing
          </span>
</div>
</section>
<!-- Availability Section -->
<section class="flex flex-col border border-outline-variant rounded-xl p-space-md bg-surface">
<h2 class="text-card-title font-card-title text-on-surface mb-space-xs">
          Availability
        </h2>
<p class="text-body font-body text-on-surface">
          12 h/week
        </p>
</section>
</div>
<!-- Sticky Bottom Action Footer -->
<div class="p-margin bg-surface border-t border-outline-variant shrink-0">
<!-- Exactly one filled button in burnt orange #B23E00, pill shape, 48dp height -->
<button class="w-full h-12 bg-primary-container text-on-primary rounded-full text-button font-button flex items-center justify-center px-space-md active:scale-[0.98] transition-transform" type="button">
        Add to team
      </button>
</div>
</main>
</body></html>
