<!DOCTYPE html>

<html lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TeamUp EXE - Add student</title>

          "fontFamily": {

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-high flex justify-center items-center min-h-screen p-0 m-0 text-on-surface antialiased font-body select-none">
<!-- Mobile Viewport Canvas (360 x 800 dp) -->
<main class="w-[360px] h-[800px] max-w-[360px] max-h-[800px] bg-surface-container-lowest flex flex-col justify-between relative overflow-hidden">
<!-- Top Content Area -->
<div class="flex flex-col w-full">
<!-- Top App Bar (Task-focused context, navigation suppressed per Semantic Shell Mandate) -->
<header class="flex justify-between items-center w-full px-margin h-12 bg-surface-container-lowest border-b border-surface-variant">
<div class="flex items-center gap-space-sm">
<button aria-label="Go back" class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-title font-title text-on-surface font-semibold tracking-tight">Add student</h1>
</div>
<div class="w-12 h-12"></div>
</header>
<!-- Operational Body Area -->
<div class="flex flex-col px-margin pt-space-md">
<!-- Search Input Field -->
<div class="relative w-full flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">search</span>
<input class="w-full h-12 pl-10 pr-4 bg-[#F3F2EF] border border-[#77756F] rounded-lg text-body font-body text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container" placeholder="Search students" type="text"/>
</div>
<!-- Filter Chips Row -->
<div class="flex items-center gap-space-xs mt-space-md overflow-x-auto no-scrollbar py-1">
<!-- Selected Chip: All -->
<button class="h-8 min-h-[32px] px-3 rounded-full bg-[#FFE2D2] text-[#3B1400] text-chip font-chip inline-flex items-center justify-center flex-shrink-0 active:scale-95 transition-all" type="button">
            All
          </button>
<!-- Unselected Chip: SE -->
<button class="h-8 min-h-[32px] px-3 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip inline-flex items-center justify-center flex-shrink-0 active:scale-95 transition-all" type="button">
            SE
          </button>
<!-- Unselected Chip: AI -->
<button class="h-8 min-h-[32px] px-3 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip inline-flex items-center justify-center flex-shrink-0 active:scale-95 transition-all" type="button">
            AI
          </button>
<!-- Unselected Chip: MKT -->
<button class="h-8 min-h-[32px] px-3 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip inline-flex items-center justify-center flex-shrink-0 active:scale-95 transition-all" type="button">
            MKT
          </button>
<!-- Unselected Chip: GD -->
<button class="h-8 min-h-[32px] px-3 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-on-surface text-chip font-chip inline-flex items-center justify-center flex-shrink-0 active:scale-95 transition-all" type="button">
            GD
          </button>
</div>
<!-- Student Rows List -->
<div class="flex flex-col mt-space-lg divide-y divide-[#D6D4CE]">
<!-- Row 1: Mai Pham -->
<label class="flex items-center justify-between py-space-sm min-h-[56px] cursor-pointer active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-space-md">
<div class="w-12 h-12 flex items-center justify-center">
<input class="w-5 h-5 rounded-[4px] border-[#77756F] text-primary-container focus:ring-0 focus:ring-offset-0 transition" type="checkbox"/>
</div>
<div class="flex flex-col -ml-2">
<span class="text-card-title font-card-title text-on-surface">Mai Pham</span>
<span class="text-metadata font-metadata text-secondary">MKT, S5</span>
</div>
</div>
</label>
<!-- Row 2: An Do -->
<label class="flex items-center justify-between py-space-sm min-h-[56px] cursor-pointer active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-space-md">
<div class="w-12 h-12 flex items-center justify-center">
<input class="w-5 h-5 rounded-[4px] border-[#77756F] text-primary-container focus:ring-0 focus:ring-offset-0 transition" type="checkbox"/>
</div>
<div class="flex flex-col -ml-2">
<span class="text-card-title font-card-title text-on-surface">An Do</span>
<span class="text-metadata font-metadata text-secondary">MKT, S5</span>
</div>
</div>
</label>
<!-- Row 3: Lan Vo -->
<label class="flex items-center justify-between py-space-sm min-h-[56px] cursor-pointer active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-space-md">
<div class="w-12 h-12 flex items-center justify-center">
<input class="w-5 h-5 rounded-[4px] border-[#77756F] text-primary-container focus:ring-0 focus:ring-offset-0 transition" type="checkbox"/>
</div>
<div class="flex flex-col -ml-2">
<span class="text-card-title font-card-title text-on-surface">Lan Vo</span>
<span class="text-metadata font-metadata text-secondary">AI, S6</span>
</div>
</div>
</label>
<!-- Row 4: Khoa Tran (Disabled / Greyed out) -->
<div class="flex items-center justify-between py-space-sm min-h-[56px] opacity-60">
<div class="flex items-center gap-space-md">
<!-- Spacer preserving alignment in place of checkbox -->
<div class="w-12 h-12 flex items-center justify-center"></div>
<div class="flex flex-col -ml-2">
<span class="text-card-title font-card-title text-[#55534D]">Khoa Tran</span>
<span class="text-metadata font-metadata text-[#77756F]">SE, S5</span>
</div>
</div>
<!-- In a team chip badge -->
<div class="flex items-center gap-1 h-7 px-2.5 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] text-[#55534D]">
<span class="material-symbols-outlined text-[16px] text-[#55534D]">lock</span>
<span class="text-chip font-chip text-[#55534D] text-[12px]">In a team</span>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Bar -->
<div class="w-full p-margin bg-surface-container-lowest border-t border-[#D6D4CE]">
<button class="w-full h-12 rounded-full bg-[#B23E00] text-on-primary text-button font-button flex items-center justify-center active:scale-[0.98] transition-all" type="button">
        Add
      </button>
</div>
</main>
</body></html>
