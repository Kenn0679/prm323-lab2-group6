<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-on-surface">
<!-- Mobile Frame 360 x 800 dp -->
<main class="w-[360px] h-[800px] max-w-[360px] max-h-[800px] bg-surface flex flex-col justify-between overflow-hidden relative border border-[#D6D4CE]">
<!-- Top Area (Header, Subline, Filter Chips) -->
<header class="w-full flex-shrink-0 bg-surface">
<!-- Top Bar (Back button, left-aligned title) -->
<div class="h-14 flex items-center px-margin border-b border-[#D6D4CE]">
<button aria-label="Go back" class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-title font-title text-on-surface ml-1">Add member</h1>
</div>
<!-- Subline Metadata -->
<div class="px-margin pt-space-md pb-space-xs">
<p class="text-metadata font-metadata text-[#55534D]">Tutor Match, 5 of 6</p>
</div>
<!-- Filter Chips Row -->
<div class="px-margin pt-space-xs pb-space-md">
<div class="flex items-center space-x-space-xs overflow-x-auto no-scrollbar py-1">
<!-- Chip: All -->
<button class="h-8 px-4 rounded-full border border-[#D6D4CE] bg-[#E9E7E2] text-[#1C1B18] text-chip font-chip flex items-center justify-center min-w-[48px] active:scale-95 transition-transform" type="button">
            All
          </button>
<!-- Chip: GD (Active) -->
<button class="h-8 px-4 rounded-full bg-[#FFE2D2] text-[#3B1400] text-chip font-chip flex items-center justify-center min-w-[48px] active:scale-95 transition-transform" type="button">
            GD
          </button>
<!-- Chip: MKT -->
<button class="h-8 px-4 rounded-full border border-[#D6D4CE] bg-[#E9E7E2] text-[#1C1B18] text-chip font-chip flex items-center justify-center min-w-[48px] active:scale-95 transition-transform" type="button">
            MKT
          </button>
<!-- Chip: AI -->
<button class="h-8 px-4 rounded-full border border-[#D6D4CE] bg-[#E9E7E2] text-[#1C1B18] text-chip font-chip flex items-center justify-center min-w-[48px] active:scale-95 transition-transform" type="button">
            AI
          </button>
</div>
</div>
<!-- Separator boundary -->
<div class="w-full h-[1px] bg-[#D6D4CE]"></div>
</header>
<!-- Student List Canvas (Scrollable area) -->
<section class="flex-1 overflow-y-auto px-margin py-space-xs divide-y divide-[#D6D4CE]">
<!-- Row 1: Minh Anh (Checked) -->
<label class="flex items-center justify-between py-space-md cursor-pointer select-none min-h-[56px] group">
<div class="flex flex-col pr-space-md">
<span class="text-card-title font-card-title text-on-surface">Minh Anh</span>
<span class="text-metadata font-metadata text-[#55534D] mt-0.5">GD, S5</span>
</div>
<div class="w-12 h-12 flex items-center justify-end">
<input checked="" class="hidden peer" type="checkbox"/>
<div class="w-5 h-5 rounded-[4px] bg-[#B23E00] flex items-center justify-center text-white peer-checked:flex peer-hover:ring-2 peer-hover:ring-[#B23E00]/20 transition-all">
<span class="material-symbols-outlined text-[16px] leading-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Row 2: Linh Phan (Unchecked) -->
<label class="flex items-center justify-between py-space-md cursor-pointer select-none min-h-[56px] group">
<div class="flex flex-col pr-space-md">
<span class="text-card-title font-card-title text-on-surface">Linh Phan</span>
<span class="text-metadata font-metadata text-[#55534D] mt-0.5">GD, S5</span>
</div>
<div class="w-12 h-12 flex items-center justify-end">
<input class="hidden peer" type="checkbox"/>
<div class="w-5 h-5 rounded-[4px] border border-[#77756F] bg-transparent flex items-center justify-center peer-checked:bg-[#B23E00] peer-checked:border-[#B23E00] transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Row 3: Bao Le (Unchecked) -->
<label class="flex items-center justify-between py-space-md cursor-pointer select-none min-h-[56px] group">
<div class="flex flex-col pr-space-md">
<span class="text-card-title font-card-title text-on-surface">Bao Le</span>
<span class="text-metadata font-metadata text-[#55534D] mt-0.5">GD, S6</span>
</div>
<div class="w-12 h-12 flex items-center justify-end">
<input class="hidden peer" type="checkbox"/>
<div class="w-5 h-5 rounded-[4px] border border-[#77756F] bg-transparent flex items-center justify-center peer-checked:bg-[#B23E00] peer-checked:border-[#B23E00] transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Row 4: Khoa Tran (Unchecked) -->
<label class="flex items-center justify-between py-space-md cursor-pointer select-none min-h-[56px] group">
<div class="flex flex-col pr-space-md">
<span class="text-card-title font-card-title text-on-surface">Khoa Tran</span>
<span class="text-metadata font-metadata text-[#55534D] mt-0.5">SE, S5</span>
</div>
<div class="w-12 h-12 flex items-center justify-end">
<input class="hidden peer" type="checkbox"/>
<div class="w-5 h-5 rounded-[4px] border border-[#77756F] bg-transparent flex items-center justify-center peer-checked:bg-[#B23E00] peer-checked:border-[#B23E00] transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>

<!-- Bottom Sticky Action Area -->
<footer class="w-full flex-shrink-0 bg-surface border-t border-[#D6D4CE] p-margin">
<!-- Exactly one filled button, burnt orange #B23E00, pill shape, 48dp height -->
<button class="w-full h-12 rounded-full bg-[#B23E00] text-white text-button font-button flex items-center justify-center active:scale-[0.98] transition-transform" type="button">
        Add
      </button>
</footer>
</main>
<script>
    // Lightweight toggle handler for plain list checkboxes
    document.querySelectorAll('label.group').forEach(row => {
      const input = row.querySelector('input[type="checkbox"]');
      const box = row.querySelector('div.w-5');
      const checkIcon = row.querySelector('.material-symbols-outlined');

      row.addEventListener('click', (e) => {
        e.preventDefault();
        const willBeChecked = !input.checked;
        input.checked = willBeChecked;

        if (willBeChecked) {
          box.classList.remove('border', 'border-[#77756F]', 'bg-transparent');
          box.classList.add('bg-[#B23E00]');
          if (checkIcon) checkIcon.classList.remove('opacity-0');
        } else {
          box.classList.add('border', 'border-[#77756F]', 'bg-transparent');
          box.classList.remove('bg-[#B23E00]');
          if (checkIcon) checkIcon.classList.add('opacity-0');
        }
      });
    });
  </script>
