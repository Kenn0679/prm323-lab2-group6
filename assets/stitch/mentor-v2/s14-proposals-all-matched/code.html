<html class="h-full" lang="en"><head>

<style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f2ede8;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-full flex justify-center items-center p-0 md:p-6 text-on-surface">
<!-- Mobile Screen Frame (360 x 800 dp) -->
<main class="w-[360px] h-[800px] bg-surface-container-lowest flex flex-col justify-between relative overflow-hidden border border-surface-dim md:rounded-xl">
<!-- Top App Bar -->
<header class="w-full h-16 bg-surface-container-lowest flex items-center px-margin z-10">
<h1 class="text-title font-title text-on-surface tracking-tight">Proposals</h1>
</header>
<!-- Center Content Canvas -->
<div class="flex-1 flex flex-col items-center justify-center px-margin text-center -mt-10">
<!-- Success Icon Enclosure -->
<div aria-hidden="true" class="w-16 h-16 rounded-full bg-operational-green-bg border border-operational-green-border flex items-center justify-center mb-space-lg">
<span class="material-symbols-outlined text-[32px] text-operational-green-border" data-icon="check">check</span>
</div>
<!-- Headline -->
<h2 class="text-headline font-headline text-on-surface mb-space-sm">All matched</h2>
<!-- Description Context -->
<p class="text-metadata font-metadata text-secondary mb-space-xl max-w-[280px]">
        All allocations have been successfully finalized for this session.
      </p>
<!-- Primary Action Button -->
<button class="w-full max-w-[280px] h-12 bg-primary-container text-on-primary font-button text-button rounded-full flex items-center justify-center px-space-md active:scale-[0.98] transition-transform" type="button">
        View teams
      </button>
</div>
<!-- Docked Layout Footer (Snackbar + Bottom Navigation Bar) -->
<div class="w-full flex flex-col">
<!-- Docked Snackbar -->
<aside aria-live="polite" class="px-margin pb-space-sm" role="status">
<div class="w-full h-12 bg-snackbar-surface text-on-primary rounded-lg px-space-md flex items-center justify-between">
<span class="text-metadata font-metadata text-on-primary">Approved</span>
<button class="text-button font-button text-primary-fixed hover:text-on-primary transition-colors min-h-[48px] px-space-xs flex items-center" type="button">
            Undo
          </button>
</div>
</aside>
<!-- Bottom Navigation Bar (3 Tabs, No badge) -->
<nav aria-label="Main Navigation" class="w-full h-16 bg-surface-container-lowest border-t border-surface-variant flex items-center justify-around px-gutter">
<!-- Tab 1: Classes -->
<button class="flex flex-col items-center justify-center w-20 min-h-[48px] py-space-xs text-secondary active:scale-[0.96] transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="school">school</span>
<span class="text-button font-button text-[12px] leading-4 mt-0.5">Classes</span>
</button>
<!-- Tab 2: Proposals (Active) -->
<button aria-current="page" class="flex flex-col items-center justify-center min-h-[48px] py-space-xs active:scale-[0.96] transition-transform" type="button">
<div class="bg-pill-active-bg text-pill-active-text rounded-full px-5 py-1 flex items-center justify-center">
<span class="material-symbols-outlined fill-icon text-[24px] text-pill-active-text" data-icon="assignment" data-weight="fill">assignment</span>
</div>
<span class="text-button font-button text-[12px] leading-4 text-pill-active-text mt-0.5">Proposals</span>
</button>
<!-- Tab 3: Profile -->
<button class="flex flex-col items-center justify-center w-20 min-h-[48px] py-space-xs text-secondary active:scale-[0.96] transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
<span class="text-button font-button text-[12px] leading-4 mt-0.5">Profile</span>
</button>
</nav>
</div>
</main>
</body></html>
