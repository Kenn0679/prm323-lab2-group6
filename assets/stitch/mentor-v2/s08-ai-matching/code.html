<body class="bg-surface-container-high flex justify-center items-center min-h-screen m-0 p-0 font-body">
<main class="w-[360px] h-[800px] bg-surface-container-lowest flex flex-col justify-between overflow-hidden relative select-none">
<!-- Top Bar: Nested Screen Navigation -->
<header class="w-full h-14 px-margin flex items-center gap-space-sm border-b border-surface-variant z-10 bg-surface-container-lowest">
<button aria-label="Go back" class="w-12 h-12 -ml-2 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-title font-title text-on-surface">
        Matching
      </h1>
</header>
<!-- Center Content Area: Operational AI Matching Canvas -->
<section class="flex-1 flex flex-col items-center justify-center px-margin text-center">
<!-- Circular Progress Indicator (Material 3 Spinner) -->
<div aria-label="Loading" class="relative w-16 h-16 mb-space-lg flex items-center justify-center" role="status">
<svg class="animate-spin w-16 h-16" fill="none" viewbox="0 0 48 48">
<circle class="text-surface-variant" cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4">
</circle>
<circle class="text-primary-container" cx="24" cy="24" r="18" stroke="currentColor" stroke-dasharray="80" stroke-dashoffset="45" stroke-linecap="round" stroke-width="4">
</circle>
</svg>
</div>
<!-- Headline -->
<h2 class="text-headline font-headline text-on-surface mb-space-xs">
        Finding teammates
      </h2>
<!-- Subline -->
<p class="text-metadata font-metadata text-secondary mb-space-xl">
        Class A, 12 students
      </p>
<!-- Action: Text Button "Cancel" -->
<button class="h-12 px-space-lg flex items-center justify-center rounded-full text-button font-button text-primary-container hover:bg-surface-container-low active:scale-[0.98] transition-all duration-150" type="button">
        Cancel
      </button>
</section>
<!-- Empty Anchor Spacer to preserve 360 x 800 viewport geometry -->
<div class="h-6 w-full pointer-events-none"></div>
</main>
