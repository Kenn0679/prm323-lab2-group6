<style>

      display: inline-block;

      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface antialiased min-h-screen flex justify-center selection:bg-secondary-container selection:text-on-primary-fixed">
<!-- Mobile Frame Container (Strict 360 x 800 dp reference standard, responsive fluid) -->
<div class="w-full max-w-[360px] min-h-[800px] h-screen flex flex-col bg-surface relative overflow-hidden">
<!-- Top App Bar: Left-aligned title only, flat, docked full-width -->
<header class="w-full h-14 px-margin flex items-center bg-surface-container-lowest shrink-0 z-10 border-b border-surface-variant">
<h1 class="font-title text-title text-on-surface">My classes</h1>
</header>
<!-- Main Content Canvas (Scrollable area, 16dp margins, flat planar structure) -->
<main class="flex-1 overflow-y-auto px-margin pt-space-md pb-space-xl flex flex-col gap-space-md">
<!-- Card 1: Class A -->
<section class="bg-surface-container-lowest border border-[#D6D4CE] rounded-xl p-space-md transition-colors active:bg-surface-container-low cursor-pointer">
<div class="flex items-baseline justify-between mb-space-md">
<h2 class="font-card-title text-card-title text-on-surface">Class A</h2>
<span class="font-metadata text-metadata text-[#55534D] tabular-nums">42 students</span>
</div>
<div class="flex flex-col gap-space-sm pt-space-xs border-t border-surface-container">
<!-- Status Line 1 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#55534D] text-[20px]" data-icon="group">group</span>
<span class="font-metadata text-metadata text-on-surface tabular-nums">12 without team</span>
</div>
<!-- Status Line 2 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#55534D] text-[20px]" data-icon="group_add">group_add</span>
<span class="font-metadata text-metadata text-on-surface tabular-nums">5 teams need members</span>
</div>
</div>
</section>
<!-- Card 2: Class B -->
<section class="bg-surface-container-lowest border border-[#D6D4CE] rounded-xl p-space-md transition-colors active:bg-surface-container-low cursor-pointer">
<div class="flex items-baseline justify-between mb-space-md">
<h2 class="font-card-title text-card-title text-on-surface">Class B</h2>
<span class="font-metadata text-metadata text-[#55534D] tabular-nums">38 students</span>
</div>
<div class="flex flex-col gap-space-sm pt-space-xs border-t border-surface-container">
<!-- Status Line 1 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#55534D] text-[20px]" data-icon="group">group</span>
<span class="font-metadata text-metadata text-on-surface tabular-nums">0 without team</span>
</div>
<!-- Status Line 2 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#1B6B3C] text-[20px]" data-icon="check_circle">check_circle</span>
<span class="font-metadata text-metadata text-[#1B6B3C] font-semibold">All matched</span>
</div>
</div>
</section>
<!-- Card 3: Class C -->
<section class="bg-surface-container-lowest border border-[#D6D4CE] rounded-xl p-space-md transition-colors active:bg-surface-container-low cursor-pointer">
<div class="flex items-baseline justify-between mb-space-md">
<h2 class="font-card-title text-card-title text-on-surface">Class C</h2>
<span class="font-metadata text-metadata text-[#55534D] tabular-nums">45 students</span>
</div>
<div class="flex flex-col gap-space-sm pt-space-xs border-t border-surface-container">
<!-- Status Line 1 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#55534D] text-[20px]" data-icon="group">group</span>
<span class="font-metadata text-metadata text-on-surface tabular-nums">9 without team</span>
</div>
<!-- Status Line 2 -->
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[#55534D] text-[20px]" data-icon="group_add">group_add</span>
<span class="font-metadata text-metadata text-on-surface tabular-nums">3 teams need members</span>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar: Docked flat, 3 tabs with active pill indicator -->
<nav class="w-full h-16 bg-surface-container-lowest border-t border-[#D6D4CE] flex items-center justify-around px-margin shrink-0 z-20">
<!-- Tab 1: Classes (Active) -->
<a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] focus:outline-none" href="#">
<div class="bg-[#FFE2D2] text-[#3B1400] rounded-full px-5 py-1 flex items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined fill-icon text-[20px]" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<span class="font-metadata text-metadata text-[#3B1400] font-semibold mt-0.5">Classes</span>
</a>
<!-- Tab 2: Proposals (Inactive) -->
<a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] text-[#55534D] focus:outline-none active:scale-95 transition-transform" href="#">
<div class="px-5 py-1 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="assignment">assignment</span>
</div>
<span class="font-metadata text-metadata text-[#55534D] mt-0.5">Proposals</span>
</a>
<!-- Tab 3: Profile (Inactive) -->
<a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] text-[#55534D] focus:outline-none active:scale-95 transition-transform" href="#">
<div class="px-5 py-1 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<span class="font-metadata text-metadata text-[#55534D] mt-0.5">Profile</span>
</a>
</nav>
</div>
