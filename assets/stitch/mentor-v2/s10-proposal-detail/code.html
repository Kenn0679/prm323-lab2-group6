<!-- Mobile Viewport Frame (360 x 800 dp) -->

</button>
<h1 class="text-title font-title text-on-surface truncate ml-1">Tutor Match</h1>
</header>

<!-- Header / Signature Area -->
<section class="flex flex-col gap-space-md pt-space-xs">
<!-- 5 Slots Row (48 dp square) -->
<div class="flex items-center justify-between w-full">
<!-- Filled slot 1: SE -->
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-[#D6F0DD] border border-[#1B6B3C]">
<span class="text-button font-button text-[#07301A]">SE</span>
</div>
<!-- Filled slot 2: SE -->
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-[#D6F0DD] border border-[#1B6B3C]">
<span class="text-button font-button text-[#07301A]">SE</span>
</div>
<!-- Filled slot 3: AI -->
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-[#D6F0DD] border border-[#1B6B3C]">
<span class="text-button font-button text-[#07301A]">AI</span>
</div>

</div>
<!-- Proposed slot: GD -->

<span class="text-button font-button text-[#3B1400]">GD</span>

</div>
</div>
</div>
<!-- Status Chip -->
<div>
<div class="inline-flex items-center gap-space-xs px-3 h-8 rounded-full bg-[#D6F0DD] text-[#1B6B3C]">
<span class="material-symbols-outlined text-[18px]">check</span>
<span class="text-chip font-chip">Strong fit</span>
</div>
</div>
</section>
<!-- Section: Why -->
