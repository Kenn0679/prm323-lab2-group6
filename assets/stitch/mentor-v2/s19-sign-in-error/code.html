<body class="bg-[#FFFFFF] text-[#1C1B18] antialiased min-h-screen flex justify-center selection:bg-secondary-container selection:text-on-primary-fixed">
<!-- Mobile Viewport Shell (360 x 800 dp) -->
<main class="w-[360px] h-[800px] bg-[#FFFFFF] relative flex flex-col justify-between overflow-hidden">
<!-- Top Content Area -->
<div class="px-margin pt-12 flex flex-col">
<!-- Screen Header -->
<header class="flex flex-col">
<h1 class="text-headline font-headline text-[#1C1B18]">
          Sign in
        </h1>
<p class="text-body font-body text-[#55534D] mt-1">
          Build balanced teams
        </p>
</header>
<!-- Spacing 32 dp -->
<div class="h-space-xl"></div>
<!-- Form Field Module -->
<div class="flex flex-col">
<!-- Field Label -->
<label class="text-label-field font-label-field text-[#1C1B18] mb-space-sm block" for="email-input">
          Email
        </label>
<!-- Input Container -->
<div class="relative w-full h-[56px] bg-[#F3F2EF] rounded-lg border-2 border-[#B3261E] flex items-center px-space-md">
<input aria-describedby="email-error-text" aria-invalid="true" class="w-full bg-transparent border-0 p-0 text-body font-body text-[#1C1B18] focus:ring-0 focus:outline-none pr-space-lg" id="email-input" type="email" value="lan@gmail"/>
<!-- Trailing Error Icon Inside Input -->
<div aria-hidden="true" class="absolute right-margin flex items-center justify-center text-[#B3261E] pointer-events-none">
<span class="material-symbols-outlined text-[24px]">error</span>
</div>
</div>
<!-- Error Row -->
<div class="flex items-center gap-space-xs mt-space-sm text-[#B3261E]" id="email-error-text" role="alert">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="text-label-field font-label-field text-[#B3261E]">
            Enter a valid email
          </span>
</div>
</div>
</div>

<footer class="p-margin pb-margin w-full bg-[#FFFFFF]">
<button class="w-full h-[48px] bg-[#B23E00] text-[#FFFFFF] rounded-full text-button font-button flex items-center justify-center cursor-pointer active:scale-[0.98] transition-transform duration-150" type="button">
