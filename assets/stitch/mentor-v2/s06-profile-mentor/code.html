<!DOCTYPE html>

<html class="h-full" lang="en"><head>

<style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f2ede8;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex items-center justify-center min-h-screen text-on-surface antialiased p-0 md:p-4">
<!-- Mobile Frame Container: 360 x 800 dp standards -->
<main class="w-full max-w-[360px] h-[800px] bg-surface-container-lowest flex flex-col justify-between relative overflow-hidden border border-surface-variant md:border-[#D6D4CE] md:rounded-xl">
<!-- Top App Bar -->
<header class="w-full h-14 px-margin flex items-center justify-start bg-surface-container-lowest border-b border-[#D6D4CE]">
<h1 class="font-title text-title text-on-surface">Profile</h1>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-margin pt-space-lg pb-space-lg flex flex-col">
<!-- Mentor Info Section -->
<section class="flex items-center gap-4 mb-space-xl">
<!-- Avatar: 56dp circular avatar with initials LN -->
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center shrink-0 border border-outline-variant">
<span class="font-title text-title text-on-primary-fixed font-semibold">LN</span>
</div>
<!-- Mentor Details -->
<div class="flex flex-col justify-center">
<h2 class="font-title text-title text-on-surface leading-tight">Lan Nguyen</h2>
<p class="font-metadata text-metadata text-on-surface-variant mt-0.5">Mentor, 3 classes</p>
</div>
</section>
<!-- Operational Settings List -->
<section class="w-full mb-space-xl flex flex-col">
<!-- Row 1: Notifications -->
<div class="min-h-[48px] py-3 flex items-center justify-between border-b border-[#D6D4CE]">
<span class="font-body text-body text-on-surface">Notifications</span>
<!-- Material 3 Switch Toggle (On State: thumb/track #B23E00) -->
<label class="relative inline-flex items-center cursor-pointer select-none">
<input checked="" class="sr-only peer" id="toggle-notifications" type="checkbox"/>
<div class="w-12 h-7 bg-primary-container peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-5 after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-surface-container-lowest after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
</div>
<!-- Row 2: Language -->
<div class="min-h-[48px] py-3 flex items-center justify-between border-b border-[#D6D4CE]">
<span class="font-body text-body text-on-surface">Language</span>
<span class="font-metadata text-metadata text-on-surface-variant">English</span>
</div>
</section>
<!-- Primary Action Spacer & Tonal Button Container -->
<section class="mt-auto pt-space-md">
<!-- Action: Tonal button "Sign out" (pill shape, fill #E9E7E2, border 1dp #D6D4CE, 14sp semibold #1C1B18, 48dp height) -->
<button class="w-full h-12 rounded-full bg-[#E9E7E2] border border-[#D6D4CE] font-button text-button text-on-surface flex items-center justify-center active:opacity-80 transition-opacity" type="button">
          Sign out
        </button>
</section>
</div>
<!-- Bottom Navigation Bar (Classes, Proposals, Profile) -->
<nav class="w-full h-16 bg-surface-container-lowest border-t border-[#D6D4CE] flex items-center justify-around px-margin z-50">
<!-- Tab 1: Classes -->
<a aria-label="Classes" class="flex flex-col items-center justify-center px-3 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="school">school</span>
<span class="font-metadata text-metadata mt-0.5">Classes</span>
</a>
<!-- Tab 2: Proposals -->
<a aria-label="Proposals" class="flex flex-col items-center justify-center px-3 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="description">description</span>
<span class="font-metadata text-metadata mt-0.5">Proposals</span>
</a>
<!-- Tab 3: Profile (Active Tab) -->
<a aria-current="page" aria-label="Profile" class="flex flex-col items-center justify-center bg-secondary-container text-on-primary-fixed rounded-full px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined material-symbols-filled text-[24px] text-on-primary-fixed" data-icon="person">person</span>
<span class="font-metadata text-metadata font-semibold text-on-primary-fixed mt-0.5">Profile</span>
</a>
</nav>
</main>
</body></html>
